[package]
name = "ifm-market-data-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Tokio-owned market-data runtime behind the IFM application API"
license = "Proprietary"

[lib]
name = "ifm_market_data_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
async-nats = { version = "=0.50.0", default-features = false, features = ["ring", "nkeys"] }
rmpv = "=1.3.1"
rmp = "=0.8.15"
lz4_flex = "0.11"
percent-encoding = "=2.3.2"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
chrono-tz = "=0.10.4"
zmij = "=1.0.23"
databento = { version = "=0.58.0", default-features = false, features = ["live", "historical"] }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs"] }
tokio-util = { version = "=0.7.19", features = ["rt"] }
time = "=0.3.55"
hickory-proto = { version = "=0.25.2", default-features = false, features = ["std"] }
futures-util = "=0.3.32"
futures = "=0.3.32"
rand = "=0.9.2"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "stream", "json"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "=1.0.11"
hyper = { version = "=1.12.0", features = ["client", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
http-body-util = "=0.1.5"
bytes = "=1.12.1"
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
base64 = "=0.23.1"
serde_json = {version="1",features=["raw_value"]}
serde = "=1.0.229"
serde_urlencoded = "=0.7.1"
sha2 = "=0.10.9"
roxmltree = "=0.21.1"

[dev-dependencies]
tokio = { version = "=1.53.1", features = ["test-util"] }
zstd = "=0.13.3"
dbn = { version = "=0.66.0", features = ["async"] }

[lints.rust]
missing_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.development]
inherits = "release"
opt-level = 1
debug = 1
incremental = true
lto = false
codegen-units = 256

[profile.release]
panic = "unwind"
opt-level = 3
lto = "thin"
codegen-units = 1


# Scoped to this new backend; the existing bridge retains registry dependencies.
[patch.crates-io]
async-nats = { path = "vendor/async-nats" }
databento = { path = "vendor/databento" }
dbn = { path = "vendor/dbn" }
