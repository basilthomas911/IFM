[package]
name = "ifm-ui-egui"
version = "0.1.0"
edition = "2024"
[dependencies]
rmpv = "=1.3.1"
rmp-serde = "=1.3.1"
serde_bytes = "=0.11.19"
eframe = { version = "=0.32.3", default-features = false, features = ["default_fonts", "wgpu", "accesskit"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
egui_plot = "=0.33.0"
egui_extras = { version = "=0.32.3", default-features = false, features = ["datepicker"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
wgpu = { version = "=25.0.2", default-features = false, features = ["dx12", "wgsl"] }
chrono-tz = "0.10.4"
async-nats = { version = "=0.50.0", default-features = false, features = ["ring", "nkeys"] }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
futures-util = "=0.3.34"
lz4_flex = "0.11"
sha2 = "=0.10.9"
uuid = { version = "=1.28.0", features = ["v4"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls-no-provider", "json", "stream"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
[features]
default = ["desktop"]
desktop = []
visual-tests = []
[dev-dependencies]
egui_kittest = { version = "=0.32.3", features = ["wgpu", "snapshot"] }

[[bin]]
name = "ifm-ui-egui"
path = "src/main.rs"
required-features = ["desktop"]

# Everyday UI iteration: retain optimized dependencies/rendering while reducing
# optimization work for this application and enabling incremental compilation.
# Separate Cargo output keeps the release/acceptance profile intact.
[profile.development]
inherits = "release"
opt-level = 1
debug = 1
incremental = true
lto = false
codegen-units = 256

[profile.development.package."*"]
opt-level = 3
