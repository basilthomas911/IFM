# Merge with docker-compose.development.yml after runtime role and credentials pass verification.
# Existing native source configuration and persistent data mounts remain required.
services:
  database-backup-host:
    environment:
      DatabaseBackup__Sources__AwsCloud__Enabled: "true"
      DatabaseBackup__Sources__AwsCloud__AcceptBackupRequests: "false"
      DatabaseBackup__Sources__AwsCloud__LiveAwsTestsEnabled: "true"
      DatabaseBackup__Sources__AwsCloud__DestructiveTestsEnabled: "false"
      DatabaseBackup__Sources__AwsCloud__Environment: Development
      DatabaseBackup__Sources__AwsCloud__WorkloadAccountId: "107651266250"
      DatabaseBackup__Sources__AwsCloud__PrimaryVaultAccountId: "107651266250"
      DatabaseBackup__Sources__AwsCloud__RecoveryVaultAccountId: "107651266250"
      DatabaseBackup__Sources__AwsCloud__PrimaryRegion: ca-central-1
      DatabaseBackup__Sources__AwsCloud__RecoveryRegion: ca-west-1
      DatabaseBackup__Sources__AwsCloud__PrimaryBucketName: ifm-db-backup-development-primary-107651266250
      DatabaseBackup__Sources__AwsCloud__RecoveryBucketName: ifm-db-backup-development-recovery-107651266250
      DatabaseBackup__Sources__AwsCloud__JournalTableName: ifm-database-backup-journal-development
      DatabaseBackup__Sources__AwsCloud__UploadRoleArn: arn:aws:iam::107651266250:role/ifm-database-backup-upload-development
      DatabaseBackup__Sources__AwsCloud__RecoveryReadRoleArn: arn:aws:iam::107651266250:role/ifm-database-backup-recovery-read-development
      DatabaseBackup__Sources__AwsCloud__PrimaryEncryptionKeyArn: arn:aws:kms:ca-central-1:107651266250:key/4772d4b1-82d9-49fc-acca-b97e73fe93df
      DatabaseBackup__Sources__AwsCloud__RecoveryEncryptionKeyArn: arn:aws:kms:ca-west-1:107651266250:key/4277d9a7-5182-4299-a61a-19ca0c5cf404
      DatabaseBackup__Sources__AwsCloud__SigningKeyArn: arn:aws:kms:ca-central-1:107651266250:key/2edd60e5-be19-483d-b4df-88df45aa2fb2
      DatabaseBackup__Sources__AwsCloud__PostgreSqlProtectionSets__0: core-postgresql
      DatabaseBackup__Sources__AwsCloud__ScyllaProtectionSets__0: read-model-scylla
      # Bound signed documents for the 6,836-file native PostgreSQL backup.
      DatabaseBackup__Sources__AwsCloud__MaximumSignedDocumentBytes: "16777216"
      DatabaseBackup__Sources__AwsCloud__WalSpoolPath: /var/lib/ifm/database-backup/aws-wal
      AWS_CONFIG_FILE: /run/aws/config
      AWS_PROFILE: development-backup
      AWS_REGION: ca-central-1
    volumes:
      - type: bind
        source: ${IFM_AWS_BACKUP_SESSION_DIR:?Set a directory containing refreshed upload-role session credentials}
        target: /run/aws
        read_only: true
      - type: bind
        source: ${IFM_BACKUP_ROOT:-E:/IFM/DatabaseBackup}/aws-wal
        target: /var/lib/ifm/database-backup/aws-wal
