[package]
name = "ifm-ui-rust"
version = "0.1.0"
edition = "2024"
[dependencies]
eframe = { version = "=0.32.3", default-features = false, features = ["default_fonts", "wgpu", "accesskit"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
egui_plot = "=0.33.0"
egui_extras = { version = "=0.32.3", default-features = false, features = ["datepicker"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
libloading = "0.8"
wgpu = { version = "=25.0.2", default-features = false, features = ["dx12", "wgsl"] }
[features]
visual-tests = []
[dev-dependencies]
egui_kittest = { version = "=0.32.3", features = ["wgpu", "snapshot"] }
