AWSTemplateFormatVersion: '2010-09-09'
Description: IFM database-backup immutable audit trail and configuration compliance controls.
Parameters:
  EnvironmentName: { Type: String, AllowedValues: [development, staging, production] }
  PrimaryBucketName: { Type: String, AllowedPattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$' }
  RecoveryBucketName: { Type: String, AllowedPattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$' }
  AuditBucketName: { Type: String, AllowedPattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$' }
  ConfigBucketName: { Type: String, AllowedPattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$' }
  SecurityAuditPrincipalArn: { Type: String, AllowedPattern: '^arn:aws:iam::[0-9]{12}:(user|role)/.+$' }
  ObjectLockMode: { Type: String, AllowedValues: [GOVERNANCE, COMPLIANCE], Default: GOVERNANCE }
Rules:
  ConfigDeliveryBucketMustBeSeparate:
    Assertions:
      - Assert: !Not [!Equals [!Ref ConfigBucketName, !Ref AuditBucketName]]
        AssertDescription: AWS Config does not support delivery to a bucket with default Object Lock retention.
Resources:
  AuditKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub IFM database-backup audit ${EnvironmentName}
      EnableKeyRotation: true
      PendingWindowInDays: 30
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root' }
            Action: [kms:CancelKeyDeletion, kms:CreateAlias, kms:CreateGrant, kms:DeleteAlias, kms:DescribeKey, kms:DisableKey, kms:DisableKeyRotation, kms:EnableKey, kms:EnableKeyRotation, kms:GetKeyPolicy, kms:GetKeyRotationStatus, kms:GetParametersForImport, kms:ImportKeyMaterial, kms:ListGrants, kms:ListKeyPolicies, kms:ListResourceTags, kms:ListRetirableGrants, kms:PutKeyPolicy, kms:RevokeGrant, kms:ScheduleKeyDeletion, kms:TagResource, kms:UntagResource, kms:UpdateAlias, kms:UpdateKeyDescription]
            Resource: '*'
          - Effect: Allow
            Principal: { Service: [cloudtrail.amazonaws.com] }
            Action: [kms:DescribeKey, kms:GenerateDataKey]
            Resource: '*'
            Condition: { StringEquals: { 'aws:SourceArn': !Sub 'arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/ifm-database-backup-${EnvironmentName}' } }
          - Sid: AWSConfigKmsDelivery
            Effect: Allow
            Principal: { Service: [config.amazonaws.com] }
            Action: [kms:Decrypt, kms:GenerateDataKey]
            Resource: '*'
            Condition:
              StringEquals: { 'aws:SourceAccount': !Ref 'AWS::AccountId' }
              ArnLike: { 'aws:SourceArn': !Sub 'arn:${AWS::Partition}:config:${AWS::Region}:${AWS::AccountId}:*' }
          - Sid: AWSConfigRoleKmsDelivery
            Effect: Allow
            Principal: { AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root' }
            Action: [kms:Decrypt, kms:GenerateDataKey]
            Resource: '*'
            Condition:
              ArnEquals: { 'aws:PrincipalArn': !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/ifm-database-backup-config-${EnvironmentName}' }
          - Sid: SecurityAuditRead
            Effect: Allow
            Principal: { AWS: !Ref SecurityAuditPrincipalArn }
            Action: [kms:Decrypt, kms:DescribeKey]
            Resource: '*'
      Tags: [{ Key: Application, Value: IFM }, { Key: Component, Value: DatabaseBackup }, { Key: Environment, Value: !Ref EnvironmentName }]
  AuditBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref AuditBucketName
      ObjectLockEnabled: true
      ObjectLockConfiguration: { ObjectLockEnabled: Enabled, Rule: { DefaultRetention: { Days: 365, Mode: !Ref ObjectLockMode } } }
      BucketEncryption: { ServerSideEncryptionConfiguration: [{ BucketKeyEnabled: true, ServerSideEncryptionByDefault: { SSEAlgorithm: aws:kms, KMSMasterKeyID: !GetAtt AuditKey.Arn } }] }
      OwnershipControls: { Rules: [{ ObjectOwnership: BucketOwnerEnforced }] }
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      VersioningConfiguration: { Status: Enabled }
  AuditBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AuditBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CloudTrailAclCheck
            Effect: Allow
            Principal: { Service: cloudtrail.amazonaws.com }
            Action: s3:GetBucketAcl
            Resource: !GetAtt AuditBucket.Arn
            Condition: { StringEquals: { 'aws:SourceArn': !Sub 'arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/ifm-database-backup-${EnvironmentName}' } }
          - Sid: CloudTrailWrite
            Effect: Allow
            Principal: { Service: cloudtrail.amazonaws.com }
            Action: s3:PutObject
            Resource: !Sub '${AuditBucket.Arn}/AWSLogs/${AWS::AccountId}/*'
            Condition: { StringEquals: { 's3:x-amz-acl': bucket-owner-full-control, 'aws:SourceArn': !Sub 'arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/ifm-database-backup-${EnvironmentName}' } }
          - Sid: SecurityAuditList
            Effect: Allow
            Principal: { AWS: !Ref SecurityAuditPrincipalArn }
            Action: s3:ListBucket
            Resource: !GetAtt AuditBucket.Arn
            Condition: { StringLike: { 's3:prefix': !Sub 'AWSLogs/${AWS::AccountId}/CloudTrail/*' } }
          - Sid: SecurityAuditRead
            Effect: Allow
            Principal: { AWS: !Ref SecurityAuditPrincipalArn }
            Action: s3:GetObject
            Resource: !Sub '${AuditBucket.Arn}/AWSLogs/${AWS::AccountId}/CloudTrail/*'
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt AuditBucket.Arn, !Sub '${AuditBucket.Arn}/*']
            Condition: { Bool: { 'aws:SecureTransport': false } }
  ConfigBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref ConfigBucketName
      BucketEncryption: { ServerSideEncryptionConfiguration: [{ BucketKeyEnabled: true, ServerSideEncryptionByDefault: { SSEAlgorithm: aws:kms, KMSMasterKeyID: !GetAtt AuditKey.Arn } }] }
      OwnershipControls: { Rules: [{ ObjectOwnership: BucketOwnerEnforced }] }
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      VersioningConfiguration: { Status: Enabled }
      Tags: [{ Key: Application, Value: IFM }, { Key: Component, Value: DatabaseBackupConfig }, { Key: Environment, Value: !Ref EnvironmentName }]
  AuditTrail:
    Type: AWS::CloudTrail::Trail
    DependsOn: AuditBucketPolicy
    Properties:
      TrailName: !Sub ifm-database-backup-${EnvironmentName}
      IsLogging: true
      IsMultiRegionTrail: true
      IncludeGlobalServiceEvents: true
      EnableLogFileValidation: true
      KMSKeyId: !GetAtt AuditKey.Arn
      S3BucketName: !Ref AuditBucket
      EventSelectors:
        - IncludeManagementEvents: true
          ReadWriteType: All
          DataResources:
            - Type: AWS::S3::Object
              Values: [!Sub 'arn:${AWS::Partition}:s3:::${PrimaryBucketName}/', !Sub 'arn:${AWS::Partition}:s3:::${RecoveryBucketName}/']
  ConfigRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ifm-database-backup-config-${EnvironmentName}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{ Effect: Allow, Principal: { Service: [config.amazonaws.com] }, Action: [sts:AssumeRole], Condition: { StringEquals: { 'aws:SourceAccount': !Ref 'AWS::AccountId' } } }]
      ManagedPolicyArns: [!Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWS_ConfigRole']
      Policies:
        - PolicyName: ConfigAuditDelivery
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:GetBucketAcl, s3:ListBucket]
                Resource: !GetAtt ConfigBucket.Arn
              - Effect: Allow
                Action: [s3:PutObject]
                Resource: !Sub '${ConfigBucket.Arn}/AWSLogs/${AWS::AccountId}/Config/*'
              - Effect: Allow
                Action: [kms:Decrypt, kms:GenerateDataKey]
                Resource: !GetAtt AuditKey.Arn
  ConfigBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ConfigBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AWSConfigBucketPermissionsCheck
            Effect: Allow
            Principal: { Service: config.amazonaws.com }
            Action: s3:GetBucketAcl
            Resource: !GetAtt ConfigBucket.Arn
            Condition:
              StringEquals: { 'aws:SourceAccount': !Ref 'AWS::AccountId' }
              ArnLike: { 'aws:SourceArn': !Sub 'arn:${AWS::Partition}:config:${AWS::Region}:${AWS::AccountId}:*' }
          - Sid: AWSConfigBucketExistenceCheck
            Effect: Allow
            Principal: { Service: config.amazonaws.com }
            Action: s3:ListBucket
            Resource: !GetAtt ConfigBucket.Arn
            Condition:
              StringEquals: { 'aws:SourceAccount': !Ref 'AWS::AccountId' }
              ArnLike: { 'aws:SourceArn': !Sub 'arn:${AWS::Partition}:config:${AWS::Region}:${AWS::AccountId}:*' }
          - Sid: AWSConfigBucketDelivery
            Effect: Allow
            Principal: { Service: config.amazonaws.com }
            Action: s3:PutObject
            Resource: !Sub '${ConfigBucket.Arn}/AWSLogs/${AWS::AccountId}/Config/*'
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref 'AWS::AccountId'
                's3:x-amz-acl': bucket-owner-full-control
              ArnLike: { 'aws:SourceArn': !Sub 'arn:${AWS::Partition}:config:${AWS::Region}:${AWS::AccountId}:*' }
          - Sid: AWSConfigRoleBucketCheck
            Effect: Allow
            Principal: { AWS: !GetAtt ConfigRole.Arn }
            Action: [s3:GetBucketAcl, s3:ListBucket]
            Resource: !GetAtt ConfigBucket.Arn
          - Sid: AWSConfigRoleBucketDelivery
            Effect: Allow
            Principal: { AWS: !GetAtt ConfigRole.Arn }
            Action: s3:PutObject
            Resource: !Sub '${ConfigBucket.Arn}/AWSLogs/${AWS::AccountId}/Config/*'
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt ConfigBucket.Arn, !Sub '${ConfigBucket.Arn}/*']
            Condition: { Bool: { 'aws:SecureTransport': false } }
  ConfigurationRecorder:
    Type: AWS::Config::ConfigurationRecorder
    DependsOn: ConfigBucketPolicy
    Properties:
      RoleARN: !GetAtt ConfigRole.Arn
      RecordingGroup: { AllSupported: true, IncludeGlobalResourceTypes: true }
  ConfigurationDeliveryChannel:
    Type: AWS::Config::DeliveryChannel
    DependsOn: ConfigBucketPolicy
    Properties:
      S3BucketName: !Ref ConfigBucket
      S3KmsKeyArn: !GetAtt AuditKey.Arn
  S3ObjectLockRule:
    Type: AWS::Config::ConfigRule
    DependsOn: ConfigurationRecorder
    Properties:
      ConfigRuleName: !Sub ifm-backup-s3-object-lock-${EnvironmentName}
      Source: { Owner: AWS, SourceIdentifier: S3_BUCKET_DEFAULT_LOCK_ENABLED }
  S3PublicReadRule:
    Type: AWS::Config::ConfigRule
    DependsOn: ConfigurationRecorder
    Properties:
      ConfigRuleName: !Sub ifm-backup-s3-public-read-${EnvironmentName}
      Source: { Owner: AWS, SourceIdentifier: S3_BUCKET_PUBLIC_READ_PROHIBITED }
Outputs:
  AuditBucketArn: { Value: !GetAtt AuditBucket.Arn }
  AuditBucketName: { Value: !Ref AuditBucket }
  ConfigBucketArn: { Value: !GetAtt ConfigBucket.Arn }
  ConfigBucketName: { Value: !Ref ConfigBucket }
  AuditTrailArn: { Value: !GetAtt AuditTrail.Arn }
