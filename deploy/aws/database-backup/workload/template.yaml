AWSTemplateFormatVersion: '2010-09-09'
Description: IFM database-backup workload journal, signing key, roles, alarms, and budget.
Parameters:
  EnvironmentName:
    Type: String
    AllowedValues: [development, staging, production]
  PrimaryVaultBucketArn:
    Type: String
    AllowedPattern: '^arn:aws:s3:::[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
  RecoveryVaultBucketArn:
    Type: String
    AllowedPattern: '^arn:aws:s3:::[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
  PrimaryEncryptionKeyArn:
    Type: String
    AllowedPattern: '^arn:aws:kms:[a-z0-9-]+:[0-9]{12}:key/.+$'
  SecurityAuditPrincipalArn:
    Type: String
    AllowedPattern: '^arn:aws:iam::[0-9]{12}:(role|user)/.+$'
  MonthlyBudgetUsd:
    Type: Number
    Default: 100
    MinValue: 1
  BudgetNotificationEmail:
    Type: String
    AllowedPattern: '^[^@ ]+@[^@ ]+$'
  RunbookUrl:
    Type: String
    Default: https://github.com/basilthomas911/IFM/blob/main/TomasAI.IFM.Application.Storage.Backup/Docs/AWS-Cloud-Backup-Restore-Operations-Runbook.md
    AllowedPattern: '^https://github\.com/basilthomas911/IFM/blob/[A-Za-z0-9._/-]+$'
Resources:
  JournalKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub IFM database-backup journal ${EnvironmentName}
      EnableKeyRotation: true
      PendingWindowInDays: 30
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AccountAdministration
            Effect: Allow
            Principal: { AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root' }
            Action: [kms:CancelKeyDeletion, kms:CreateAlias, kms:CreateGrant, kms:DeleteAlias, kms:DescribeKey, kms:DisableKey, kms:DisableKeyRotation, kms:EnableKey, kms:EnableKeyRotation, kms:GetKeyPolicy, kms:GetKeyRotationStatus, kms:GetParametersForImport, kms:GetPublicKey, kms:ImportKeyMaterial, kms:ListGrants, kms:ListKeyPolicies, kms:ListResourceTags, kms:ListRetirableGrants, kms:PutKeyPolicy, kms:RevokeGrant, kms:ScheduleKeyDeletion, kms:TagResource, kms:UntagResource, kms:UpdateAlias, kms:UpdateKeyDescription]
            Resource: '*'
          - Sid: AllowDynamoDbServiceUse
            Effect: Allow
            Principal: { AWS: '*' }
            Action: [kms:CreateGrant, kms:Decrypt, kms:DescribeKey, kms:Encrypt, kms:GenerateDataKey, kms:GenerateDataKeyWithoutPlaintext, kms:ReEncryptFrom, kms:ReEncryptTo]
            Resource: '*'
            Condition:
              StringEquals:
                kms:CallerAccount: !Ref AWS::AccountId
              StringLike:
                kms:ViaService: dynamodb.*.amazonaws.com
      Tags:
        - { Key: Application, Value: IFM }
        - { Key: Component, Value: DatabaseBackup }
        - { Key: Environment, Value: !Ref EnvironmentName }
  JournalKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub alias/ifm/database-backup/${EnvironmentName}/journal
      TargetKeyId: !Ref JournalKey
  SigningKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub IFM database-backup manifest signing ${EnvironmentName}
      KeySpec: ECC_NIST_P256
      KeyUsage: SIGN_VERIFY
      PendingWindowInDays: 30
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AccountAdministration
            Effect: Allow
            Principal: { AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root' }
            Action: [kms:CancelKeyDeletion, kms:CreateAlias, kms:CreateGrant, kms:DeleteAlias, kms:DescribeKey, kms:DisableKey, kms:EnableKey, kms:GetKeyPolicy, kms:GetPublicKey, kms:ListGrants, kms:ListKeyPolicies, kms:ListResourceTags, kms:PutKeyPolicy, kms:RevokeGrant, kms:ScheduleKeyDeletion, kms:TagResource, kms:UntagResource, kms:UpdateAlias, kms:UpdateKeyDescription]
            Resource: '*'
          - Sid: AllowApprovedDocumentSigning
            Effect: Allow
            Principal: { AWS: '*' }
            Action: [kms:GetPublicKey, kms:Sign, kms:Verify]
            Resource: '*'
            Condition:
              ArnEquals:
                'aws:PrincipalArn':
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/ifm-database-backup-upload-${EnvironmentName}'
                  - !Ref SecurityAuditPrincipalArn
      Tags:
        - { Key: Application, Value: IFM }
        - { Key: Component, Value: DatabaseBackup }
        - { Key: Environment, Value: !Ref EnvironmentName }
  SigningKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub alias/ifm/database-backup/${EnvironmentName}/signing
      TargetKeyId: !Ref SigningKey
  ExecutionJournal:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub ifm-database-backup-journal-${EnvironmentName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: GSI1PK, AttributeType: S }
        - { AttributeName: GSI1SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: WorkQueueIndex
          KeySchema:
            - { AttributeName: GSI1PK, KeyType: HASH }
            - { AttributeName: GSI1SK, KeyType: RANGE }
          Projection: { ProjectionType: KEYS_ONLY }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !GetAtt JournalKey.Arn
      DeletionProtectionEnabled: true
      Tags:
        - { Key: Application, Value: IFM }
        - { Key: Component, Value: DatabaseBackup }
        - { Key: Environment, Value: !Ref EnvironmentName }
  JournalThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ifm-database-backup-journal-throttling-${EnvironmentName}
      AlarmDescription: IFM backup journal throttling detected
      Namespace: AWS/DynamoDB
      MetricName: ThrottledRequests
      Dimensions: [{ Name: TableName, Value: !Ref ExecutionJournal }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
  UploadRole:
    Type: AWS::IAM::Role
    Metadata:
      cfn-lint:
        config:
          ignore_checks: [W3037]
    Properties:
      RoleName: !Sub ifm-database-backup-upload-${EnvironmentName}
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: [ecs-tasks.amazonaws.com] }
            Action: [sts:AssumeRole]
            Condition: { StringEquals: { 'aws:SourceAccount': !Ref 'AWS::AccountId' } }
      Policies:
        - PolicyName: PublishPrimaryVault
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:AbortMultipartUpload, s3:GetObject, s3:GetObjectRetention, s3:GetObjectVersion, s3:ListBucket, s3:ListBucketMultipartUploads, s3:ListMultipartUploadParts, s3:PutObject, s3:PutObjectRetention]
                Resource: [!Ref PrimaryVaultBucketArn, !Sub '${PrimaryVaultBucketArn}/*']
              - Effect: Allow
                Action: [dynamodb:BatchGetItem, dynamodb:ConditionCheckItem, dynamodb:DeleteItem, dynamodb:DescribeContinuousBackups, dynamodb:DescribeTable, dynamodb:GetItem, dynamodb:PutItem, dynamodb:Query, dynamodb:TransactWriteItems, dynamodb:UpdateItem]
                Resource: [!GetAtt ExecutionJournal.Arn, !Sub '${ExecutionJournal.Arn}/index/*']
              - Effect: Allow
                Action: [kms:GetPublicKey, kms:Sign, kms:Verify]
                Resource: !GetAtt SigningKey.Arn
              - Effect: Allow
                Action: [kms:Encrypt, kms:GenerateDataKey]
                Resource: !Ref PrimaryEncryptionKeyArn
              - Effect: Allow
                Action: [cloudwatch:PutMetricData]
                Resource: '*'
                Condition:
                  StringEquals:
                    'cloudwatch:namespace': IFM/DatabaseBackup
  VerificationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ifm-database-backup-verification-${EnvironmentName}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { AWS: !GetAtt UploadRole.Arn }
            Action: [sts:AssumeRole]
      Policies:
        - PolicyName: VerifyVaults
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectLegalHold, s3:GetObjectRetention, s3:GetObjectVersion, s3:ListBucket, s3:ListBucketVersions]
                Resource: [!Ref PrimaryVaultBucketArn, !Sub '${PrimaryVaultBucketArn}/*']
              - Effect: Allow
                Action: [kms:GetPublicKey, kms:Verify]
                Resource: !GetAtt SigningKey.Arn
              - Effect: Allow
                Action: [kms:Decrypt, kms:DescribeKey]
                Resource: !Ref PrimaryEncryptionKeyArn
  RetentionPlanRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ifm-database-backup-retention-plan-${EnvironmentName}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { AWS: !GetAtt UploadRole.Arn }
            Action: [sts:AssumeRole]
      Policies:
        - PolicyName: ReadRetentionEvidence
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectLegalHold, s3:GetObjectRetention, s3:GetObjectVersion, s3:ListBucketVersions]
                Resource: [!Ref PrimaryVaultBucketArn, !Sub '${PrimaryVaultBucketArn}/*']
              - Effect: Allow
                Action: [kms:Decrypt, kms:DescribeKey]
                Resource: !Ref PrimaryEncryptionKeyArn
  RetentionExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ifm-database-backup-retention-execution-${EnvironmentName}
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root' }
            Action: [sts:AssumeRole]
            Condition: { Bool: { 'aws:MultiFactorAuthPresent': true } }
      Policies:
        - PolicyName: ExactVersionDeletionOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:DeleteObjectVersion, s3:GetObjectLegalHold, s3:GetObjectRetention, s3:GetObjectVersion]
                Resource: !Sub '${PrimaryVaultBucketArn}/v1/environment/${EnvironmentName}/*'
              - Effect: Deny
                Action: [s3:BypassGovernanceRetention, s3:DeleteBucket, s3:PutReplicationConfiguration]
                Resource: [!Ref PrimaryVaultBucketArn, !Sub '${PrimaryVaultBucketArn}/*']
  LegalHoldRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ifm-database-backup-legal-hold-${EnvironmentName}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { AWS: !Ref SecurityAuditPrincipalArn }
            Action: [sts:AssumeRole]
            Condition: { Bool: { 'aws:MultiFactorAuthPresent': true } }
      Policies:
        - PolicyName: ExactVersionLegalHold
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:GetObjectLegalHold, s3:GetObjectVersion, s3:PutObjectLegalHold]
                Resource: !Sub '${PrimaryVaultBucketArn}/v1/environment/${EnvironmentName}/*'
  AuditRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ifm-database-backup-audit-${EnvironmentName}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { AWS: !Ref SecurityAuditPrincipalArn }
            Action: [sts:AssumeRole]
      Policies:
        - PolicyName: ReadBackupControls
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:DescribeContinuousBackups, dynamodb:DescribeTable]
                Resource: !GetAtt ExecutionJournal.Arn
              - Effect: Allow
                Action: [s3:GetBucketObjectLockConfiguration, s3:GetBucketPolicy, s3:GetBucketVersioning, s3:GetEncryptionConfiguration, s3:GetInventoryConfiguration, s3:GetReplicationConfiguration, s3:ListBucketVersions]
                Resource: [!Ref PrimaryVaultBucketArn, !Ref RecoveryVaultBucketArn]
              - Effect: Allow
                Action: [kms:DescribeKey, kms:GetKeyPolicy, kms:GetKeyRotationStatus, kms:GetPublicKey]
                Resource: [!GetAtt JournalKey.Arn, !GetAtt SigningKey.Arn, !Ref PrimaryEncryptionKeyArn]
  BackupOperationsAlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub ifm-database-backup-operations-${EnvironmentName}
      DisplayName: IFM database backup
      Tags:
        - { Key: Application, Value: IFM }
        - { Key: Component, Value: DatabaseBackup }
        - { Key: Environment, Value: !Ref EnvironmentName }
  BackupOperationsEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: email
      Endpoint: !Ref BudgetNotificationEmail
      TopicArn: !Ref BackupOperationsAlarmTopic
  BackupOperationsDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub ifm-database-backup-${EnvironmentName}
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0,
              "y": 0,
              "width": 24,
              "height": 12,
              "properties": {
                "region": "${AWS::Region}",
                "title": "IFM database backup operational metrics",
                "view": "timeSeries",
                "period": 60,
                "stat": "Maximum",
                "metrics": [
                  ["IFM/DatabaseBackup", "ifm.database_backup.aws.intent.age", "environment", "${EnvironmentName}"],
                  [".", "ifm.database_backup.aws.operation.phase_age", ".", "."],
                  [".", "ifm.database_backup.aws.journal.conflicts", ".", "."],
                  [".", "ifm.database_backup.aws.outbox.backlog", ".", "."],
                  [".", "ifm.database_backup.aws.upload.throughput", ".", "."],
                  [".", "ifm.database_backup.aws.multipart.stale", ".", "."],
                  [".", "ifm.database_backup.aws.wal.lag", ".", "."],
                  [".", "ifm.database_backup.aws.wal.gaps", ".", "."],
                  [".", "ifm.database_backup.aws.replication.lag", ".", "."],
                  [".", "ifm.database_backup.aws.replication.failures", ".", "."],
                  [".", "ifm.database_backup.aws.kms.denials", ".", "."],
                  [".", "ifm.database_backup.aws.restore.verifications", ".", "."],
                  [".", "ifm.database_backup.aws.retention.drift", ".", "."],
                  [".", "ifm.database_backup.aws.rpo", ".", "."],
                  [".", "ifm.database_backup.aws.rto", ".", "."],
                  [".", "ifm.database_backup.aws.estimated_cost", ".", "."]
                ]
              }
            }
          ]
        }
  IntentAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ifm-database-backup-intent-age-${EnvironmentName}
      AlarmDescription: !Sub '${RunbookUrl}; inspect the operation journal, never credentials.'
      AlarmActions: [!Ref BackupOperationsAlarmTopic]
      Namespace: IFM/DatabaseBackup
      MetricName: ifm.database_backup.aws.intent.age
      Dimensions: [{ Name: environment, Value: !Ref EnvironmentName }]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 300
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
  OperationPhaseAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ifm-database-backup-phase-age-${EnvironmentName}
      AlarmDescription: !Sub '${RunbookUrl}; inspect the operation ID and phase in the journal.'
      AlarmActions: [!Ref BackupOperationsAlarmTopic]
      Namespace: IFM/DatabaseBackup
      MetricName: ifm.database_backup.aws.operation.phase_age
      Dimensions: [{ Name: environment, Value: !Ref EnvironmentName }]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 900
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
  JournalConflictAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ifm-database-backup-journal-conflict-${EnvironmentName}
      AlarmDescription: !Sub '${RunbookUrl}#journal-pitr'
      AlarmActions: [!Ref BackupOperationsAlarmTopic]
      Namespace: IFM/DatabaseBackup
      MetricName: ifm.database_backup.aws.journal.conflicts
      Dimensions: [{ Name: environment, Value: !Ref EnvironmentName }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
  OutboxBacklogAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ifm-database-backup-outbox-backlog-${EnvironmentName}
      AlarmDescription: !Sub '${RunbookUrl}#credential-failure'
      AlarmActions: [!Ref BackupOperationsAlarmTopic]
      Namespace: IFM/DatabaseBackup
      MetricName: ifm.database_backup.aws.outbox.backlog
      Dimensions: [{ Name: environment, Value: !Ref EnvironmentName }]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 100
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
  UploadThroughputAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ifm-database-backup-upload-throughput-${EnvironmentName}
      AlarmDescription: !Sub '${RunbookUrl}; inspect throttling, disk pressure, and network capacity.'
      AlarmActions: [!Ref BackupOperationsAlarmTopic]
      Namespace: IFM/DatabaseBackup
      MetricName: ifm.database_backup.aws.upload.throughput
      Dimensions: [{ Name: environment, Value: !Ref EnvironmentName }]
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 1048576
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching
  StaleMultipartAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ifm-database-backup-stale-multipart-${EnvironmentName}
      AlarmDescription: !Sub '${RunbookUrl}#multipart-reconciliation'
      AlarmActions: [!Ref BackupOperationsAlarmTopic]
      Namespace: IFM/DatabaseBackup
      MetricName: ifm.database_backup.aws.multipart.stale
      Dimensions: [{ Name: environment, Value: !Ref EnvironmentName }]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
  WalLagAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ifm-database-backup-wal-lag-${EnvironmentName}
      AlarmDescription: !Sub '${RunbookUrl}#wal-gap'
      AlarmActions: [!Ref BackupOperationsAlarmTopic]
      Namespace: IFM/DatabaseBackup
      MetricName: ifm.database_backup.aws.wal.lag
      Dimensions: [{ Name: environment, Value: !Ref EnvironmentName }]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 300
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
  WalGapAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ifm-database-backup-wal-gap-${EnvironmentName}
      AlarmDescription: !Sub '${RunbookUrl}#wal-gap'
      AlarmActions: [!Ref BackupOperationsAlarmTopic]
      Namespace: IFM/DatabaseBackup
      MetricName: ifm.database_backup.aws.wal.gaps
      Dimensions: [{ Name: environment, Value: !Ref EnvironmentName }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
  RuntimeReplicationLagAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ifm-database-backup-runtime-replication-lag-${EnvironmentName}
      AlarmDescription: !Sub '${RunbookUrl}#replication-failure'
      AlarmActions: [!Ref BackupOperationsAlarmTopic]
      Namespace: IFM/DatabaseBackup
      MetricName: ifm.database_backup.aws.replication.lag
      Dimensions: [{ Name: environment, Value: !Ref EnvironmentName }]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 900
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
  RuntimeReplicationFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ifm-database-backup-runtime-replication-failure-${EnvironmentName}
      AlarmDescription: !Sub '${RunbookUrl}#replication-failure'
      AlarmActions: [!Ref BackupOperationsAlarmTopic]
      Namespace: IFM/DatabaseBackup
      MetricName: ifm.database_backup.aws.replication.failures
      Dimensions: [{ Name: environment, Value: !Ref EnvironmentName }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
  KmsDenialAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ifm-database-backup-kms-denial-${EnvironmentName}
      AlarmDescription: !Sub '${RunbookUrl}#kmskey-recovery'
      AlarmActions: [!Ref BackupOperationsAlarmTopic]
      Namespace: IFM/DatabaseBackup
      MetricName: ifm.database_backup.aws.kms.denials
      Dimensions: [{ Name: environment, Value: !Ref EnvironmentName }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
  RestoreVerificationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ifm-database-backup-restore-verification-${EnvironmentName}
      AlarmDescription: !Sub '${RunbookUrl}#fresh-target-cleanup'
      AlarmActions: [!Ref BackupOperationsAlarmTopic]
      Metrics:
        - Id: failed
          Expression: scylla + postgresql
          Label: Failed restore verifications
          ReturnData: true
        - Id: scylla
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: IFM/DatabaseBackup
              MetricName: ifm.database_backup.aws.restore.verifications
              Dimensions:
                - { Name: engine, Value: scylladb }
                - { Name: environment, Value: !Ref EnvironmentName }
                - { Name: outcome, Value: failed }
            Period: 300
            Stat: Sum
        - Id: postgresql
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: IFM/DatabaseBackup
              MetricName: ifm.database_backup.aws.restore.verifications
              Dimensions:
                - { Name: engine, Value: postgresql }
                - { Name: environment, Value: !Ref EnvironmentName }
                - { Name: outcome, Value: failed }
            Period: 300
            Stat: Sum
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
  RetentionDriftAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ifm-database-backup-retention-drift-${EnvironmentName}
      AlarmDescription: !Sub '${RunbookUrl}#retention-plan-failure'
      AlarmActions: [!Ref BackupOperationsAlarmTopic]
      Namespace: IFM/DatabaseBackup
      MetricName: ifm.database_backup.aws.retention.drift
      Dimensions: [{ Name: environment, Value: !Ref EnvironmentName }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
  RpoAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ifm-database-backup-rpo-${EnvironmentName}
      AlarmDescription: !Sub '${RunbookUrl}; select a complete restore point and investigate publication lag.'
      AlarmActions: [!Ref BackupOperationsAlarmTopic]
      Namespace: IFM/DatabaseBackup
      MetricName: ifm.database_backup.aws.rpo
      Dimensions: [{ Name: environment, Value: !Ref EnvironmentName }]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 300
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
  RtoAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ifm-database-backup-rto-${EnvironmentName}
      AlarmDescription: !Sub '${RunbookUrl}#primary-vault-loss-and-recovery-only-restore'
      AlarmActions: [!Ref BackupOperationsAlarmTopic]
      Namespace: IFM/DatabaseBackup
      MetricName: ifm.database_backup.aws.rto
      Dimensions: [{ Name: environment, Value: !Ref EnvironmentName }]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3600
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
  CostAnomalyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ifm-database-backup-cost-anomaly-${EnvironmentName}
      AlarmDescription: !Sub '${RunbookUrl}; review measured storage, requests, replication, retrieval, and drill usage.'
      AlarmActions: [!Ref BackupOperationsAlarmTopic]
      Namespace: IFM/DatabaseBackup
      MetricName: ifm.database_backup.aws.estimated_cost
      Dimensions: [{ Name: environment, Value: !Ref EnvironmentName }]
      Statistic: Maximum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: !Ref MonthlyBudgetUsd
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub ifm-database-backup-${EnvironmentName}
        BudgetLimit: { Amount: !Ref MonthlyBudgetUsd, Unit: USD }
        BudgetType: COST
        TimeUnit: MONTHLY
        CostFilters: { TagKeyValue: [user:Component$DatabaseBackup] }
      NotificationsWithSubscribers:
        - Notification: { ComparisonOperator: GREATER_THAN, NotificationType: FORECASTED, Threshold: 80, ThresholdType: PERCENTAGE }
          Subscribers: [{ Address: !Ref BudgetNotificationEmail, SubscriptionType: EMAIL }]
Outputs:
  JournalTableName: { Value: !Ref ExecutionJournal }
  JournalKeyArn: { Value: !GetAtt JournalKey.Arn }
  SigningKeyArn: { Value: !GetAtt SigningKey.Arn }
  UploadRoleArn: { Value: !GetAtt UploadRole.Arn }
  VerificationRoleArn: { Value: !GetAtt VerificationRole.Arn }
  RetentionPlanRoleArn: { Value: !GetAtt RetentionPlanRole.Arn }
  RetentionExecutionRoleArn: { Value: !GetAtt RetentionExecutionRole.Arn }
  LegalHoldRoleArn: { Value: !GetAtt LegalHoldRole.Arn }
  AuditRoleArn: { Value: !GetAtt AuditRole.Arn }
  BackupOperationsDashboardName: { Value: !Ref BackupOperationsDashboard }
  BackupOperationsAlarmTopicArn: { Value: !Ref BackupOperationsAlarmTopic }
