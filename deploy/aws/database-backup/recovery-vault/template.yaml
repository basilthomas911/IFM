AWSTemplateFormatVersion: '2010-09-09'
Description: IFM independent recovery vault with immutable S3 storage and regional KMS key.
Parameters:
  EnvironmentName: { Type: String, AllowedValues: [development, staging, production] }
  RecoveryBucketName: { Type: String, AllowedPattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$' }
  RecoveryAuditBucketName: { Type: String, AllowedPattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$' }
  PrimaryBucketName: { Type: String, AllowedPattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$' }
  WorkloadAccountId: { Type: String, AllowedPattern: '^[0-9]{12}$' }
  ReplicationRoleArn: { Type: String, AllowedPattern: '^arn:aws:iam::[0-9]{12}:role/.+$' }
  RetentionDays: { Type: Number, Default: 35, MinValue: 35 }
  ObjectLockMode: { Type: String, AllowedValues: [GOVERNANCE, COMPLIANCE], Default: GOVERNANCE }
Resources:
  RecoveryKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub IFM recovery vault ${EnvironmentName}
      EnableKeyRotation: true
      MultiRegion: false
      PendingWindowInDays: 30
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: RecoveryAdministration
            Effect: Allow
            Principal: { AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root' }
            Action: [kms:CancelKeyDeletion, kms:CreateAlias, kms:CreateGrant, kms:DeleteAlias, kms:DescribeKey, kms:DisableKey, kms:DisableKeyRotation, kms:EnableKey, kms:EnableKeyRotation, kms:GetKeyPolicy, kms:GetKeyRotationStatus, kms:GetParametersForImport, kms:ImportKeyMaterial, kms:ListGrants, kms:ListKeyPolicies, kms:ListResourceTags, kms:ListRetirableGrants, kms:PutKeyPolicy, kms:RevokeGrant, kms:ScheduleKeyDeletion, kms:TagResource, kms:UntagResource, kms:UpdateAlias, kms:UpdateKeyDescription]
            Resource: '*'
          - Sid: ReplicationEncryption
            Effect: Allow
            Principal: { AWS: !Sub 'arn:${AWS::Partition}:iam::${WorkloadAccountId}:root' }
            Action: [kms:Encrypt, kms:GenerateDataKey, kms:ReEncryptTo]
            Resource: '*'
            Condition:
              StringEquals: { 'kms:ViaService': !Sub 's3.${AWS::Region}.amazonaws.com' }
              ArnEquals: { 'aws:PrincipalArn': !Ref ReplicationRoleArn }
          - Sid: RecoveryRoleDecryption
            Effect: Allow
            Principal: { AWS: '*' }
            Action: [kms:Decrypt, kms:DescribeKey]
            Resource: '*'
            Condition:
              ArnEquals:
                'aws:PrincipalArn': !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/ifm-database-backup-recovery-read-${EnvironmentName}'
      Tags: [{ Key: Application, Value: IFM }, { Key: Component, Value: DatabaseBackup }, { Key: Environment, Value: !Ref EnvironmentName }]
  RecoveryKeyAlias:
    Type: AWS::KMS::Alias
    Properties: { AliasName: !Sub 'alias/ifm/database-backup/${EnvironmentName}/recovery-vault', TargetKeyId: !Ref RecoveryKey }
  RecoveryAuditBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref RecoveryAuditBucketName
      BucketEncryption: { ServerSideEncryptionConfiguration: [{ ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } }] }
      OwnershipControls: { Rules: [{ ObjectOwnership: BucketOwnerEnforced }] }
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      VersioningConfiguration: { Status: Enabled }
  RecoveryAuditBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref RecoveryAuditBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PermitServerAccessLogs
            Effect: Allow
            Principal: { Service: logging.s3.amazonaws.com }
            Action: s3:PutObject
            Resource: !Sub '${RecoveryAuditBucket.Arn}/access/*'
            Condition:
              StringEquals: { 'aws:SourceAccount': !Ref 'AWS::AccountId' }
              ArnLike: { 'aws:SourceArn': !Sub 'arn:${AWS::Partition}:s3:::${RecoveryBucketName}' }
          - Sid: PermitInventoryDelivery
            Effect: Allow
            Principal: { Service: s3.amazonaws.com }
            Action: s3:PutObject
            Resource: !Sub '${RecoveryAuditBucket.Arn}/inventory/*'
            Condition:
              StringEquals: { 'aws:SourceAccount': !Ref 'AWS::AccountId', 's3:x-amz-acl': bucket-owner-full-control }
              ArnLike: { 'aws:SourceArn': !Sub 'arn:${AWS::Partition}:s3:::${RecoveryBucketName}' }
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt RecoveryAuditBucket.Arn, !Sub '${RecoveryAuditBucket.Arn}/*']
            Condition: { Bool: { 'aws:SecureTransport': false } }
  RecoveryBucket:
    Type: AWS::S3::Bucket
    DependsOn: RecoveryAuditBucketPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref RecoveryBucketName
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: true
            ServerSideEncryptionByDefault: { SSEAlgorithm: aws:kms, KMSMasterKeyID: !GetAtt RecoveryKey.Arn }
      ObjectLockEnabled: true
      ObjectLockConfiguration:
        ObjectLockEnabled: Enabled
        Rule: { DefaultRetention: { Days: !Ref RetentionDays, Mode: !Ref ObjectLockMode } }
      OwnershipControls: { Rules: [{ ObjectOwnership: BucketOwnerEnforced }] }
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      VersioningConfiguration: { Status: Enabled }
      LoggingConfiguration: { DestinationBucketName: !Ref RecoveryAuditBucket, LogFilePrefix: access/ }
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipart
            Status: Enabled
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 7 }
      InventoryConfigurations:
        - Id: RecoveryVersions
          Enabled: true
          IncludedObjectVersions: All
          ScheduleFrequency: Daily
          Destination:
            BucketArn: !GetAtt RecoveryAuditBucket.Arn
            Format: CSV
            Prefix: inventory
  RecoveryBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref RecoveryBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt RecoveryBucket.Arn, !Sub '${RecoveryBucket.Arn}/*']
            Condition: { Bool: { 'aws:SecureTransport': false } }
          - Sid: PermitReplication
            Effect: Allow
            Principal: { AWS: !Sub 'arn:${AWS::Partition}:iam::${WorkloadAccountId}:root' }
            Action: [s3:ObjectOwnerOverrideToBucketOwner, s3:ReplicateDelete, s3:ReplicateObject, s3:ReplicateTags]
            Resource: !Sub '${RecoveryBucket.Arn}/*'
            Condition: { ArnEquals: { 'aws:PrincipalArn': !Ref ReplicationRoleArn } }
          - Sid: DenyUnencryptedWrites
            Effect: Deny
            Principal: '*'
            Action: s3:PutObject
            Resource: !Sub '${RecoveryBucket.Arn}/*'
            Condition: { StringNotEquals: { 's3:x-amz-server-side-encryption': aws:kms } }
  RecoveryReadRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ifm-database-backup-recovery-read-${EnvironmentName}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { AWS: !Sub 'arn:${AWS::Partition}:iam::${WorkloadAccountId}:root' }
            Action: [sts:AssumeRole]
            Condition: { StringEquals: { 'sts:ExternalId': !Sub 'ifm-database-backup-${EnvironmentName}' } }
      Policies:
        - PolicyName: ReadExactRecoveryVersions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectLegalHold, s3:GetObjectRetention, s3:GetObjectVersion, s3:ListBucket, s3:ListBucketVersions]
                Resource: [!GetAtt RecoveryBucket.Arn, !Sub '${RecoveryBucket.Arn}/*']
              - Effect: Allow
                Action: [kms:Decrypt, kms:DescribeKey]
                Resource: !GetAtt RecoveryKey.Arn
  ReplicationLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ifm-database-backup-replication-lag-${EnvironmentName}
      AlarmDescription: IFM recovery vault is more than 15 minutes behind the primary vault
      Namespace: AWS/S3
      MetricName: ReplicationLatency
      Dimensions: [{ Name: SourceBucket, Value: !Ref PrimaryBucketName }, { Name: DestinationBucket, Value: !Ref RecoveryBucket }, { Name: RuleId, Value: ReplicateAllImmutableVersions }]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 900
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: ignore
Outputs:
  RecoveryBucketArn: { Value: !GetAtt RecoveryBucket.Arn }
  RecoveryBucketName: { Value: !Ref RecoveryBucket }
  RecoveryAuditBucketName: { Value: !Ref RecoveryAuditBucket }
  RecoveryEncryptionKeyArn: { Value: !GetAtt RecoveryKey.Arn }
  RecoveryReadRoleArn: { Value: !GetAtt RecoveryReadRole.Arn }
  ReplicationLatencyAlarmArn: { Value: !GetAtt ReplicationLatencyAlarm.Arn }
